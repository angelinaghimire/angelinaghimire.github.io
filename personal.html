```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Personal — Angelina Ghimire</title>
  <meta
    name="description"
    content="A few things Angelina Ghimire loves outside of technology."
  >

  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --paper: #faf9f5;
      --ink: #1c1f1d;
      --ink-soft: #4b4f4a;
      --accent: #2f5d50;
      --line: #dedad0;
      --muted: #8f8b7f;
      --placeholder: #efece3;
      --max-width: 640px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 3.5rem 1.5rem 4rem;
    }

    /* Navigation */

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    nav a {
      color: var(--ink-soft);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.01em;
      padding-bottom: 3px;
      border-bottom: 1px solid transparent;
      transition:
        color 0.15s ease,
        border-color 0.15s ease;
    }

    nav a:hover {
      color: var(--ink);
      border-color: var(--line);
    }

    nav a[aria-current="page"] {
      color: var(--ink);
      border-color: var(--accent);
    }

    /* Typography */

    h1,
    h2,
    h3 {
      font-family: "Fraunces", Georgia, serif;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 2.5rem;
      line-height: 1.15;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    h2 {
      margin: 0 0 1.5rem;
      font-size: 1.6rem;
      line-height: 1.2;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    p {
      max-width: 60ch;
      margin: 0 0 1.25rem;
    }

    a {
      color: var(--accent);
      text-decoration-color: rgba(47, 93, 80, 0.35);
      text-underline-offset: 2px;
    }

    a:hover {
      text-decoration-color: var(--accent);
    }

    /* Intro */

    .intro {
      margin-bottom: 4rem;
    }

    .intro .eyebrow {
      margin: 0 0 0.4rem;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .intro h1 {
      margin-bottom: 1.5rem;
    }

    .intro p {
      color: var(--ink-soft);
    }

    /* Sections */

    .section {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--line);
    }

    .section-intro {
      color: var(--ink-soft);
      font-size: 0.96rem;
      margin-bottom: 2rem;
    }

    /* Bookshelf */

    .bookshelf {
      position: relative;
      padding: 2.5rem 1rem 0;
      margin: 1rem -0.5rem 0;
    }

    .books {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
      height: 190px;
      padding: 0 1rem;
    }

    .book {
      position: relative;
      width: 38px;
      height: 145px;
      flex: 0 0 38px;
      border-radius: 2px 4px 3px 2px;
      border-left: 2px solid rgba(0, 0, 0, 0.12);
      box-shadow:
        2px 2px 4px rgba(0, 0, 0, 0.08),
        inset -3px 0 rgba(255, 255, 255, 0.08);
      cursor: default;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .book:hover {
      transform: translateY(-10px) rotate(-1deg);
      box-shadow:
        3px 8px 12px rgba(0, 0, 0, 0.13);
      z-index: 3;
    }

    .book:nth-child(2) {
      height: 165px;
    }

    .book:nth-child(3) {
      height: 135px;
    }

    .book:nth-child(4) {
      height: 155px;
    }

    .book:nth-child(5) {
      height: 178px;
    }

    .book:nth-child(6) {
      height: 143px;
    }

    .book:nth-child(7) {
      height: 168px;
    }

    .book:nth-child(8) {
      height: 150px;
    }

    .book:nth-child(9) {
      height: 174px;
    }

    .book-title {
      position: absolute;
      inset: 10px 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: rgba(255, 255, 255, 0.9);
      font-family: "Fraunces", Georgia, serif;
      font-size: 0.72rem;
      line-height: 1.1;
      text-align: center;
    }

    .book-author {
      position: absolute;
      bottom: 9px;
      left: 5px;
      right: 5px;
      color: rgba(255, 255, 255, 0.68);
      font-size: 0.48rem;
      text-align: center;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .book:nth-child(1) {
      background: #536b5c;
    }

    .book:nth-child(2) {
      background: #7b6654;
    }

    .book:nth-child(3) {
      background: #8c7667;
    }

    .book:nth-child(4) {
      background: #425b61;
    }

    .book:nth-child(5) {
      background: #6d5d4d;
    }

    .book:nth-child(6) {
      background: #68745c;
    }

    .book:nth-child(7) {
      background: #795e5b;
    }

    .book:nth-child(8) {
      background: #53646a;
    }

    .book:nth-child(9) {
      background: #8a7252;
    }

    .shelf {
      height: 13px;
      background: #6c6256;
      border-radius: 2px;
      box-shadow:
        0 5px 0 #50493f,
        0 8px 12px rgba(0, 0, 0, 0.12);
    }

    .book-note {
      margin: 1.5rem 0 0;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      font-style: italic;
    }

    /* Book list */

    .book-list {
      margin-top: 2.5rem;
      border-top: 1px solid var(--line);
    }

    .book-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--line);
    }

    .book-item-title {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1rem;
    }

    .book-item-author {
      margin: 0.15rem 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .book-type {
      align-self: center;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* Collage */

    .collage {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-auto-rows: 75px;
      gap: 9px;
      margin-top: 1.5rem;
    }

    .tile {
      position: relative;
      overflow: hidden;
      background: var(--placeholder);
      border: 1px solid var(--line);
      border-radius: 3px;
    }

    .tile img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .tile:hover img {
      transform: scale(1.05);
    }

    .tile-large {
      grid-column: span 3;
      grid-row: span 3;
    }

    .tile-wide {
      grid-column: span 3;
      grid-row: span 2;
    }

    .tile-tall {
      grid-column: span 2;
      grid-row: span 3;
    }

    .tile-small {
      grid-column: span 2;
      grid-row: span 2;
    }

    .tile-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 1.75rem 0.65rem 0.55rem;
      color: white;
      font-family: "Fraunces", Georgia, serif;
      font-size: 0.85rem;
      background: linear-gradient(
        transparent,
        rgba(0, 0, 0, 0.55)
      );
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .tile:hover .tile-caption {
      opacity: 1;
    }

    /* Little notes */

    .love-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
      margin-top: 1rem;
      border-top: 1px solid var(--line);
    }

    .love {
      padding: 1.25rem 1rem 1.25rem 0;
      border-bottom: 1px solid var(--line);
    }

    .love:nth-child(even) {
      padding-left: 1rem;
      border-left: 1px solid var(--line);
    }

    .love h3 {
      margin: 0 0 0.25rem;
      font-size: 1rem;
      font-weight: 500;
    }

    .love p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    /* Currently */

    .currently {
      margin-top: 4rem;
      padding: 1.5rem;
      background: #f1eee5;
      border: 1px solid var(--line);
      border-radius: 3px;
    }

    .currently h2 {
      margin-bottom: 1rem;
      font-size: 1.35rem;
    }

    .currently p {
      margin-bottom: 0.5rem;
      font-size: 0.92rem;
    }

    .currently span {
      color: var(--accent);
      font-weight: 500;
    }

    /* Footer */

    footer {
      margin-top: 4rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* Responsive */

    @media (max-width: 560px) {
      .wrap {
        padding-top: 2.5rem;
      }

      h1 {
        font-size: 2.1rem;
      }

      .books {
        gap: 3px;
        padding: 0;
      }

      .book {
        width: 30px;
        flex-basis: 30px;
      }

      .book-title {
        font-size: 0.58rem;
      }

      .book-author {
        display: none;
      }

      .collage {
        grid-auto-rows: 65px;
      }

      .love-list {
        grid-template-columns: 1fr;
      }

      .love:nth-child(even) {
        padding-left: 0;
        border-left: none;
      }
    }

    @media (max-width: 400px) {
      .book:nth-child(9) {
        display: none;
      }

      .book:nth-child(8) {
        display: none;
      }
    }
  </style>
</head>

</html>
